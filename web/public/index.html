<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="alternate" type="application/rss+xml" title="Racesow updates" href="/blog.xml">
  <title>Racesow · Warsow Race Records</title>
  <meta name="description" content="Live world records, maps and player rankings from Warsow race servers.">
  <!-- og -->
  <meta property="og:site_name" content="Racesow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Racesow · Warsow Race Records">
  <meta property="og:description" content="Live world records, maps and player rankings from Warsow race servers.">
  <meta property="og:image" content="/assets/img/warsow-logo.png">
  <meta name="twitter:card" content="summary">
  <!-- /og -->
  <link rel="icon" href="/assets/img/warsow-logo.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <!-- Vendored three.js (no build step; CSP blocks CDNs). The replay viewer
       (assets/js/replay.js) is dynamically imported and resolves "three"
       through this map; OrbitControls imports "three" internally. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/assets/vendor/three/three.module.js",
      "three/addons/controls/OrbitControls.js": "/assets/vendor/three/OrbitControls.js",
      "three/addons/loaders/GLTFLoader.js": "/assets/vendor/three/GLTFLoader.js"
    }
  }
  </script>
  <!-- Tastatur privacy-friendly analytics. Auto-tracks pageviews by patching
       history.pushState — the SPA router (app.js go()) drives every in-app
       navigation through it, so /maps, /map/5, /player/5, /replay/… are all
       counted. Named action events (search, replay, demo download, connect
       copy, outbound clicks) are sent from app.js via track(). Needs
       script-src + connect-src https://tastatur.dev in the nginx CSP. -->
  <script defer data-site="FB1WRC5D0PFFHKZ5" src="https://tastatur.dev/t.js"></script>
</head>
<body>
  <header class="site">
    <div class="header-inner">
      <div class="brand" data-nav="#/">
        <img src="/assets/img/warsow-logo.png" alt="Warsow">
        <div>
          <div class="wordmark">RACE<b>SOW</b></div>
          <div class="tag">GO FAST · RACE RECORDS</div>
        </div>
      </div>
      <nav class="main">
        <a data-nav="#/" href="/">Overview</a>
        <a data-nav="#/maps" href="/maps">Maps</a>
        <a data-nav="#/players" href="/players">Players</a>
        <a data-nav="#/tournaments" href="/tournaments">Tournaments</a>
        <a data-nav="#/live" href="/live">Live<span class="livedot" aria-hidden="true"></span></a>
        <a data-nav="#/about" href="/about">About</a>
      </nav>
      <div class="gsearch">
        <span class="ico">⌕</span>
        <input id="gsearch" type="text" placeholder="Search maps &amp; players…" autocomplete="off">
        <div class="results" id="gresults"></div>
      </div>
    </div>
    <div class="streaks"></div>
  </header>

  <main id="app">
    <div class="loading"><span class="spinner"></span></div>
  </main>

  <footer class="site">
    <div class="fi">
      <!-- Demos and Awards moved down here from the header nav to keep the top
           bar to the six things people actually navigate by. Both attributes
           are required on every in-app link: data-nav alone breaks middle-click
           and open-in-new-tab, href alone falls out of the SPA router into a
           full page reload (see the delegated click handler in app.js). -->
      <div>Seeded from the livesow database · growing live from Warsow race servers. · <a data-nav="#/blog" href="/blog">Updates</a> · <a data-nav="#/demo" href="/demo">Demos</a> · <a data-nav="#/achievements" href="/achievements">Awards</a> · <a data-nav="#/stats" href="/stats">When people play</a> · <a data-nav="#/colors" href="/colors">Name colors</a> · <a href="https://status.racesow.org/" target="_blank" rel="noopener">Server status</a></div>
      <div class="foot-right">
        <!-- Buy Me a Coffee widget button — injects an <a> (inline SVG cup + Poppins).
             Needs script-src cdnjs.buymeacoffee.com in the nginx CSP. SRI pins the
             exact bytes (versioned URL); if BMC ever re-publishes it, the button
             silently drops — recompute the hash to restore it. -->
        <script src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" integrity="sha384-OibPdNn05smfqAFi21q8C4YkzZLEjwXs7kTtiqrJwOv7PtZefVaGPzKgX4rJfvWv" crossorigin="anonymous" data-name="bmc-button" data-slug="streed" data-color="#262b3d" data-emoji="☕" data-font="Poppins" data-text="Buy me a coffee" data-outline-color="#ffffff" data-font-color="#ffffff" data-coffee-color="#FFDD00"></script>
        <div id="foot-updated"></div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/app.js"></script>
</body>
</html>
