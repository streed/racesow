// ---------------------------------------------------------------------------
// server.cfg  --  Racesow Warfork 2.16 hrace (racemod) dedicated server
//
// Identity/networking + the rs_api_*/rs_mirror_* wiring are supplied by
// entrypoint.sh from the container environment (env.cfg, exec'd after this).
// This file holds the race gameplay tuning, shared in spirit with the Warsow
// server.cfg so both games feel the same. Override via EXTRA_ARGS.
// ---------------------------------------------------------------------------

// --- Gameplay --------------------------------------------------------------
set g_gametype "hrace"
set g_instagib "0"
set g_timelimit "0"            // race maps are not time-limited
set g_warmup_timelimit "0"
set g_race_gametype "1"

// --- Movement / race feel --------------------------------------------------
set g_allow_selfdamage "0"     // no self damage on rockets/plasma
set g_allow_falldamage "0"     // classic race: no fall damage
set g_allow_bunny "1"          // bunnyhopping enabled
set g_projectile_touch_owner "1"
set g_disable_vote_gametype "1"
// NOTE: rs_quad_fix (patch-quad-fix) is deferred on Warfork (it edits g_racesow,
// which here is Gelmo's racesow module). Weapon-def physics parity with Warsow
// (Gelmo's rs_* weapon cvars via RS_Init) is a follow-up — see design doc D2.

// --- Server behaviour ------------------------------------------------------
// v1 runs sv_pure 0: the racesow-native libgame is loose in basewf (not paked)
// and maps come from the shared read-only pool by direct-connect. Paking the
// module + a pure list (as the Warsow image does) is a follow-up before a
// public/listed launch.
set sv_pure "0"
set sv_pps "40"                // snapshots/sec; keeps spectated players + mesh ghosts smooth
set sv_maxrate "0"
set sv_compresspackets "1"
set g_floodprotection_messages "6"
set g_floodprotection_seconds "4"
set g_floodprotection_penalty "3"

// --- Voting ----------------------------------------------------------------
set g_vote_allowed "1"
set g_vote_percent "51"
set g_vote_duration "20"

// --- Chat / MOTD -----------------------------------------------------------
// Boot-time fallback only: with INGEST_URL set, the gametype overwrites this
// from the central /api/game/motd within seconds (hrace/motd.as).
set sv_motd "1"
set sv_motdstring "Racesow on Warfork - go fast!"

echo "server.cfg loaded: Warfork hrace race server ready"
