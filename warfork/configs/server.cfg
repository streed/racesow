// Phase 0 spike race config (stock Warfork gametype). Minimal on purpose:
// the point is to prove the platform, not to tune gameplay. Real race tuning
// gets ported from ../server/configs/server.cfg once the port begins.
set sv_hostname "Racesow Warfork Spike"
set g_gametype "race"

// Keep it LAN/direct-connect for the spike unless SV_PUBLIC=1 is passed; the
// entrypoint's +set sv_public wins over this at launch anyway.
set sv_public "0"

// Race-friendly basics.
set g_instagib "0"
set g_warmup_timelimit "0"
set g_timelimit "0"
