# /etc/systemd/system/nfs-server.service.d/racesow.conf on the EU box.
# nfs.conf.example binds nfsd to the WireGuard address (host = 10.66.0.1), which
# exists only once the tunnel is up; without this ordering nfsd can start
# first at boot, fail to bind and stay down. And the export is a bind mount,
# which must be in place before exportfs runs.
#   systemctl daemon-reload && systemctl restart nfs-server
[Unit]
After=wg-quick@wg-racesow.service srv-racesow-store.mount
Requires=wg-quick@wg-racesow.service
RequiresMountsFor=/srv/racesow/store
