# Racesow WARFORK game-server — ADDITIVE bundle.
#
# Runs a Warfork race server ALONGSIDE the existing Warsow `warsow-race`
# (docker-compose.agent.yml) on the SAME box, feeding the SAME racesow.org
# stats and joined to the SAME cross-server mesh. It is deliberately a separate
# compose file so it never recreates or disturbs the running Warsow server:
#
#   docker compose -f docker-compose.warfork.yml up -d --build
#
# Ports are offset from Warsow's (game 44400 / mirror 44450) so both coexist:
#   Warfork game  UDP 44410, http/pak TCP 44411, mirror UDP 44451.
# Records are tagged on the unified leaderboard via VERSION_NAME ("wf <ver>",
# mirroring Warsow's "wsw 2.1"); the mesh tag is [<REGION>-WF].
#
# Maps are the SHARED pool: this mounts the very same ./server/maps directory
# the Warsow service already uses (read-only) — zero duplicate storage.
#
# NOTE: the build context / image is finalized by Task #2 (warfork/Dockerfile,
# pending the hettoo-vs-DenMSC codebase decision from the research workflow).
# Until then `--build` has nothing to build; the env/port/volume CONTRACT below
# is stable and is what the Warfork entrypoint will consume.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  warfork-race:
    build:
      context: .                  # repo root: Dockerfile COPYs server/ + warfork/
      dockerfile: warfork/Dockerfile
    image: warfork-race:racesow
    container_name: warfork-race
    restart: unless-stopped
    logging: *default-logging
    tty: true
    # Warfork, like Warsow, holds every mounted pk3 open at once; a full map
    # mirror blows past the 2048-fd soft limit.
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    ports:
      - "${WF_SV_PORT:-44410}:44410/udp"
      - "${WF_SV_HTTP_PORT:-44411}:44411/tcp"
      # Cross-server mesh port (distinct from Warsow's 44450 so both bind on the
      # same host). Published so peers on other hosts reach this server's mirror.
      - "${WF_MIRROR_PORT:-44451}:44451/udp"
    environment:
      SV_HOSTNAME: "${WF_SV_HOSTNAME:-Racesow Warfork}"
      SV_MAXCLIENTS: "${WF_SV_MAXCLIENTS:-16}"
      SV_PUBLIC: "${WF_SV_PUBLIC:-1}"
      SV_PORT: "44410"
      SV_HTTP_PORT: "44411"
      # How often (seconds) the engine rescans the map pool for new packs
      # (enginepatches/patch-mapscan.py, now applied to Warfork too). The pool
      # is handed over as fs_cdpath, so a pack that lands after boot is found.
      # 0 = only at startup.
      MAPSCAN_SECONDS: "${MAPSCAN_SECONDS:-60}"
      # Which copy the engine reads: "auto" prefers the store, "snapshot"
      # takes the local copy even when the store answers. A box whose store is
      # a mount across a slow link wants snapshot: the engine opens every pack
      # itself, which no cache helps with (docs/map-store-runbook.md).
      MAP_STORE_READ: "${MAP_STORE_READ:-auto}"
      # The shared RS_Api* native (g_rs_api.cpp) derives its libc write paths from
      # $WARSOW_DIR; on Warfork it must equal the engine base ($WF_DIR=/warfork),
      # else `top` / the live-record refresh write to a dead /warsow path the
      # engine never reads. (entrypoint.sh also exports this; set here too so a
      # bare `up -d` recreate — no rebuild — is already correct.)
      WARSOW_DIR: "/warfork"
      G_GAMETYPE: "hrace"       # our racemod gametype (hrace.gt), NOT stock Warfork `race`
      RCON_PASSWORD: "${WF_RCON_PASSWORD:-}"
      # The gametype POSTs every finish to the central ingest endpoint
      # (racelog.as -> RS_ApiReportRace), name-keyed, exactly like Warsow.
      INGEST_URL: "${INGEST_URL:?set INGEST_URL in .env}"
      INGEST_TOKEN: "${WF_INGEST_TOKEN:?set WF_INGEST_TOKEN (a NEW per-server token) in .env}"
      # Unified-leaderboard tag: records show a [wf <ver>] pill + own rank bucket.
      VERSION_NAME: "${WF_VERSION_NAME:-wf 2.16}"
      LOG_SHIP: "${WF_LOG_SHIP:-1}"
      SV_UPLOADS_BASEURL: "${WF_SV_UPLOADS_BASEURL:-}"
      # Cross-game mesh (UDP). Peers = the OTHER three nodes (see design doc
      # §11.1). Reuse the boxes' existing shared MIRROR_SECRET.
      MIRROR_PEERS: "${WF_MIRROR_PEERS:-}"     # e.g. "us.east...:44450 eu.frankfurt...:44450 eu.frankfurt...:44451"
      MIRROR_SECRET: "${MIRROR_SECRET:-}"      # SAME shared key as the Warsow nodes
      MIRROR_PORT: "44451"
      MIRROR_TAG: "${WF_MIRROR_TAG:-}"         # US-WF / EU-WF
    # Same watchdog as the Warsow tier, and this is the tier that proved it was
    # needed: on 2026-08-08 the idle rotation switched to a map whose brush
    # models won't load, the game module died ("GClip_SetBrushModel: NULL model
    # in 'trigger_multiple'"), and the engine then spun at 100% CPU answering
    # nothing for 38 hours. The container never exited, so `restart:
    # unless-stopped` had nothing to react to and Docker reported it Up.
    # gamehealth.sh probes with getinfo and restarts the engine when it stops
    # replying. (It signals the engine, which is why warfork/entrypoint.sh now
    # supervises it as a child instead of exec'ing it — signals to PID 1 are
    # discarded by the kernel.)
    healthcheck:
      test: ["CMD", "/usr/local/bin/gamehealth.sh"]
      interval: 20s
      timeout: 15s
      retries: 6          # ~2 min of unbroken silence before a restart
      start_period: 240s  # cold boot answers nothing for a while
    volumes:
      # SHARED map pool — the identical host dir the Warsow service mounts,
      # read-only. The entrypoint hands it to the engine as fs_cdpath (ONE
      # symlink, not one per pack), so a pack that lands afterwards is found by
      # the next sv_mapscan sweep without a restart — zero-copy, no duplicate
      # storage. On a box that reads the shared store over NFS, WARFORK_MAPS_DIR
      # (this directory's .env) is the host mountpoint, exactly as MAP_STORE_DIR
      # is for the Warsow service, and rslave lets a remount after a link drop
      # reach the running container. docs/map-store-runbook.md.
      - type: bind
        source: ${WARFORK_MAPS_DIR:-./server/maps}
        target: /warfork/maps_extra
        read_only: true
        bind:
          propagation: rslave
          create_host_path: true
      # The store's last-known local copy (scripts/map-snapshot.sh, hourly).
      # The entrypoint uses it when the store does not answer at launch, and
      # reads it first to warm the pack cache — the cache is keyed on pack
      # size+name, so a pack read from local disk answers for the same pack in
      # the store and a cold boot costs seconds instead of a twenty-minute NFS
      # scan. On the box that owns the store this is the same pool as above
      # and both are local disk, so it costs nothing there.
      - type: bind
        source: ${MAP_STORE_SNAPSHOT_DIR:-./server/maps-snapshot}
        target: /warfork/maps_fallback
        read_only: true
        bind:
          create_host_path: true
      # Warfork's own record/demo state (separate from Warsow's volumes). Mounted
      # at the real mod write dir /warfork/racesow/... (engine fs_basepath=/warfork
      # + fs_game=racesow) — the same path the RS_Api* native now writes to — so
      # these persist across recreates. (Previously mounted at /racesow/..., a
      # third orphaned path that persisted nothing.)
      - wf_racelog:/warfork/racesow/racelog
      - wf_topscores:/warfork/racesow/topscores
      - wf_demos:/warfork/racesow/demos

volumes:
  wf_racelog:
  wf_topscores:
  wf_demos:
