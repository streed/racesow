# atmoz/sftp user definitions — one jail per line.
# Format: user:pass[:e][:UID[:GID[:dir1[,dir2]...]]]
#   * empty password field  -> key-only login (a public key MUST be mounted)
#   * trailing `incoming`    -> creates the single writable subdir /home/<user>/incoming
#     while the chroot root /home/<user> stays root-owned (required for chroot).
#
# UID/GID 1500 is unused by the game (999) / node (1000) containers. Files land
# on the host under server/sftp-uploads/<user>/incoming owned by 1500:1500.
demos::1500:1500:incoming
