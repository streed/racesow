# HTTP pak mirror (docker-compose.yml, profile httpdl). Clients fetch
# <SV_UPLOADS_BASEURL>/<gamedir>/<pack>.pk3. The mod's own packs are exported
# to pakshare at launch (entrypoint.sh export_pakshare). Map packs are served
# straight from the map store, or from its local snapshot when the store is
# unreachable, so a pack added to the store is downloadable immediately.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    location / {
        try_files $uri @store;
    }
    location @store {
        root /srv/store;
        try_files $uri @snapshot;
    }
    location @snapshot {
        root /srv/snapshot;
        try_files $uri =404;
    }
}
